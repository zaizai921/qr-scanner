<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二维码扫描</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .scan-btn {
            background: #07c160;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
            transition: transform 0.2s;
        }
        
        .scan-btn:active {
            transform: scale(0.95);
        }
        
        .scan-btn svg {
            width: 24px;
            height: 24px;
        }
        
        #scanner-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        
        #scanner-container.active {
            display: flex;
        }
        
        .scanner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        #reader {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 确保视频铺满 */
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 隐藏默认的扫描框，我们自己控制 */
        #reader__dashboard_section_csr span {
            display: none !important;
        }
        
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        
        .scan-frame {
            width: 280px;
            height: 280px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 16px;
            position: relative;
        }
        
        .scan-frame .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #07c160;
            border-style: solid;
        }
        
        .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
        .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #07c160;
            top: 0;
            animation: scan 2.5s linear infinite;
            box-shadow: 0 0 10px #07c160, 0 0 20px rgba(7, 193, 96, 0.5);
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        .scan-tip {
            position: absolute;
            bottom: 80px;
            color: rgba(255,255,255,0.9);
            font-size: 15px;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 20px;
        }
        
        .permission-tip {
            color: #999;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            line-height: 1.6;
        }
        
        .camera-select {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            width: 80%;
            max-width: 300px;
            background: white;
        }
    </style>
</head>
<body>
    <h1>🔍 二维码扫描V4</h1>
    
    <button class="scan-btn" onclick="startScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        点击扫码
    </button>
    
    <select id="camera-select" class="camera-select" onchange="startScanWithCamera(this.value)">
        <option value="">自动选择摄像头...</option>
    </select>
    
    <p class="permission-tip">
        请将二维码对准扫描框<br>
        支持高密二维码 / 反光 / 模糊场景
    </p>

    <!-- 扫码界面 -->
    <div id="scanner-container">
        <div class="scanner-header">
            <span>将二维码放入框内自动识别</span>
            <button class="close-btn" onclick="stopScan()">✕</button>
        </div>
        <div id="reader"></div>
        <div class="scan-overlay">
            <div class="scan-frame">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <div class="scan-line"></div>
            </div>
            <p class="scan-tip">正在识别...</p>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        const scannerContainer = document.getElementById('scanner-container');
        const cameraSelect = document.getElementById('camera-select');

        // 获取后置摄像头
        async function getBackCamera() {
            try {
                const devices = await Html5Qrcode.getCameras();
                console.log('可用摄像头:', devices);
                
                if (!devices || devices.length === 0) {
                    throw new Error('未找到摄像头');
                }
                
                // 优先找后置摄像头
                const backCamera = devices.find(d => 
                    /back|rear|environment|后置|后面|背面|wide/i.test(d.label)
                );
                
                if (backCamera) {
                    return backCamera.id;
                }
                
                // 多个摄像头时，通常后置在后面
                if (devices.length > 1) {
                    return devices[devices.length - 1].id;
                }
                
                return devices[0].id;
                
            } catch (err) {
                console.error('获取摄像头失败:', err);
                throw err;
            }
        }

        async function startScan() {
            try {
                scannerContainer.classList.add('active');
                
                const cameraId = await getBackCamera();
                console.log('使用摄像头 ID:', cameraId);
                
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    cameraId,
                    { 
                        fps: 5,                    // 降低帧率，提升单次解析质量（高密码需要更长时间分析）
                        qrbox: { width: 280, height: 280 },  // 扫描框大小
                        aspectRatio: 1.0,          // 正方形扫描区域
                        videoConstraints: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 },
                            facingMode: { exact: "environment" },
                            advanced: [{ zoom: 2 }]  // 尝试请求 2 倍数码变焦（部分设备支持）
                        },
                        disableFlip: false           // 允许识别翻转的二维码
                    },
                    (decodedText, decodedResult) => {
                        // 扫描成功
                        console.log('✅ 扫描结果:', decodedText);
                        stopScan();
                        alert('扫描结果：\n\n' + decodedText);
                    },
                    (errorMessage) => {
                        // 解析中的错误，正常情况，无需处理
                    }
                );
                
            } catch (err) {
                console.error('启动失败:', err);
                
                // 如果是摄像头选择问题，显示手动选择
                if (err.name === 'OverconstrainedError' || err.name === 'NotAllowedError' || 
                    err.message?.includes('camera') || err.message?.includes('设备')) {
                    await showCameraSelector();
                } else {
                    alert('启动失败: ' + err.message);
                    stopScan();
                }
            }
        }

        // 显示摄像头选择器
        async function showCameraSelector() {
            try {
                const devices = await Html5Qrcode.getCameras();
                cameraSelect.innerHTML = '<option value="">请选择摄像头（建议选后置）</option>';
                
                devices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.text = device.label || `摄像头 ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                
                cameraSelect.style.display = 'block';
                scannerContainer.classList.remove('active');
                
            } catch (e) {
                alert('无法获取摄像头列表: ' + e.message);
            }
        }

        // 用指定摄像头启动
        async function startScanWithCamera(deviceId) {
            if (!deviceId) return;
            
            try {
                scannerContainer.classList.add('active');
                
                if (html5QrCode) {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                }
                
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    deviceId,
                    { 
                        fps: 5,
                        qrbox: { width: 280, height: 280 },
                        aspectRatio: 1.0,
                        disableFlip: false
                    },
                    (decodedText) => {
                        console.log('✅ 扫描结果:', decodedText);
                        stopScan();
                        alert('扫描结果：\n\n' + decodedText);
                    },
                    () => {}
                );
                
                cameraSelect.style.display = 'none';
                
            } catch (err) {
                alert('启动失败: ' + err.message);
                stopScan();
            }
        }

        async function stopScan() {
            scannerContainer.classList.remove('active');
            
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {
                    console.log('清理资源:', e);
                }
                html5QrCode = null;
            }
        }

        window.addEventListener('beforeunload', stopScan);
    </script>
</body>
</html>
