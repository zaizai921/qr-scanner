<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二维码扫描</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .scan-btn {
            background: #07c160;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
            transition: transform 0.2s;
        }
        
        .scan-btn:active {
            transform: scale(0.95);
        }
        
        .scan-btn svg {
            width: 24px;
            height: 24px;
        }
        
        #scanner-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        
        #scanner-container.active {
            display: flex;
        }
        
        .scanner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        #reader {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #reader video {
            object-fit: cover !important;
        }
        
        .permission-tip {
            color: #999;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            line-height: 1.6;
        }
        
        .camera-select {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <h1>🔍 二维码扫描V3</h1>
    
    <button class="scan-btn" onclick="startScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        点击扫码
    </button>
    
    <!-- 摄像头选择下拉框（如果自动选择失败时显示） -->
    <select id="camera-select" class="camera-select" onchange="startScanWithCamera(this.value)">
        <option value="">请选择后置摄像头</option>
    </select>
    
    <p class="permission-tip">
        请允许摄像头权限<br>
        自动选择后置摄像头
    </p>

    <!-- 扫码界面 -->
    <div id="scanner-container">
        <div class="scanner-header">
            <span>将二维码放入框内自动识别</span>
            <button class="close-btn" onclick="stopScan()">✕</button>
        </div>
        <div id="reader"></div>
    </div>

    <script>
        let html5QrCode = null;
        const scannerContainer = document.getElementById('scanner-container');
        const readerElement = document.getElementById('reader');
        const cameraSelect = document.getElementById('camera-select');

        // 获取后置摄像头的 deviceId
        async function getBackCameraId() {
            try {
                const devices = await Html5Qrcode.getCameras();
                console.log('可用摄像头:', devices);
                
                if (!devices || devices.length === 0) {
                    throw new Error('未找到摄像头');
                }
                
                // 优先找标签包含 back/rear/environment 的摄像头
                const backCamera = devices.find(d => 
                    /back|rear|environment|后置|后面|背面/i.test(d.label)
                );
                
                if (backCamera) {
                    return { id: backCamera.id, label: backCamera.label };
                }
                
                // 如果没找到，通常最后一个摄像头是后置（前置一般在前面）
                // 或者返回所有设备让用户选择
                if (devices.length > 1) {
                    return { id: devices[devices.length - 1].id, label: devices[devices.length - 1].label };
                }
                
                return { id: devices[0].id, label: devices[0].label };
                
            } catch (err) {
                console.error('获取摄像头失败:', err);
                throw err;
            }
        }

        async function startScan() {
            try {
                scannerContainer.classList.add('active');
                
                // 先获取后置摄像头
                const camera = await getBackCameraId();
                console.log('使用摄像头:', camera.label, camera.id);
                
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    camera.id,  // 使用具体的 deviceId，强制指定后置摄像头
                    { 
                        fps: 10,
                        qrbox: { width: 280, height: 280 },
                        aspectRatio: 1.0,
                        videoConstraints: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 },
                            facingMode: { exact: "environment" }  // 双重保险
                        }
                    },
                    (decodedText, decodedResult) => {
                        console.log('扫描结果:', decodedText);
                        stopScan();
                        alert('扫描结果：\n\n' + decodedText);
                    },
                    (errorMessage) => {
                        // 解析中的错误，忽略
                    }
                );
                
            } catch (err) {
                console.error('启动失败:', err);
                
                // 如果自动选择失败，显示摄像头列表让用户手动选
                if (err.name === 'OverconstrainedError' || err.name === 'NotAllowedError' || err.message.includes('camera')) {
                    showCameraSelector();
                } else {
                    alert('启动失败: ' + err.message);
                    stopScan();
                }
            }
        }

        // 显示摄像头选择器
        async function showCameraSelector() {
            try {
                const devices = await Html5Qrcode.getCameras();
                cameraSelect.innerHTML = '<option value="">请选择后置摄像头</option>';
                
                devices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.text = device.label || `摄像头 ${index + 1}`;
                    cameraSelect.appendChild(option);
                });
                
                cameraSelect.style.display = 'block';
                alert('自动选择后置摄像头失败，请从下拉列表手动选择');
                
            } catch (e) {
                alert('无法获取摄像头列表: ' + e.message);
                stopScan();
            }
        }

        // 用指定摄像头启动
        async function startScanWithCamera(deviceId) {
            if (!deviceId) return;
            
            try {
                if (html5QrCode) {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                }
                
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    deviceId,
                    { 
                        fps: 10,
                        qrbox: { width: 280, height: 280 },
                        aspectRatio: 1.0
                    },
                    (decodedText) => {
                        console.log('扫描结果:', decodedText);
                        stopScan();
                        alert('扫描结果：\n\n' + decodedText);
                    },
                    () => {}
                );
                
                cameraSelect.style.display = 'none';
                
            } catch (err) {
                alert('启动失败: ' + err.message);
            }
        }

        async function stopScan() {
            scannerContainer.classList.remove('active');
            cameraSelect.style.display = 'none';
            
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {
                    console.log('清理资源:', e);
                }
                html5QrCode = null;
            }
        }

        window.addEventListener('beforeunload', stopScan);
    </script>
</body>
</html>
