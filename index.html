<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二维码扫描</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .scan-btn {
            background: #07c160;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
            transition: transform 0.2s;
        }
        
        .scan-btn:active {
            transform: scale(0.95);
        }
        
        .scan-btn svg {
            width: 24px;
            height: 24px;
        }
        
        #scanner-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        
        #scanner-container.active {
            display: flex;
        }
        
        .scanner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            z-index: 10;
        }
        
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        #reader {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* 隐藏 Html5Qrcode 默认 UI */
        #reader__dashboard_section_csr,
        #reader__dashboard_section_swaplink,
        #reader__camera_permission_button,
        #reader__status_span {
            display: none !important;
        }
        
        /* 自定义扫描框 */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        
        .scan-frame {
            width: 320px;
            height: 320px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            position: relative;
            background: rgba(0,0,0,0.1);
        }
        
        .scan-frame .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #07c160;
            border-style: solid;
        }
        
        .corner-tl { top: -2px; left: -2px; border-width: 5px 0 0 5px; border-top-left-radius: 20px; }
        .corner-tr { top: -2px; right: -2px; border-width: 5px 5px 0 0; border-top-right-radius: 20px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 5px 5px; border-bottom-left-radius: 20px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 5px 5px 0; border-bottom-right-radius: 20px; }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #07c160, transparent);
            top: 0;
            animation: scan 2s linear infinite;
            box-shadow: 0 0 15px #07c160, 0 0 30px rgba(7, 193, 96, 0.6);
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        .scan-tip {
            margin-top: 40px;
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 10px 24px;
            border-radius: 24px;
        }
        
        .permission-tip {
            color: #999;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>🔍 二维码扫描V5</h1>
    
    <button class="scan-btn" onclick="startScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        点击扫码
    </button>
    
    <p class="permission-tip">
        请将二维码对准扫描框<br>
        支持高密二维码识别
    </p>

    <!-- 扫码界面 -->
    <div id="scanner-container">
        <div class="scanner-header">
            <span>将二维码放入框内</span>
            <button class="close-btn" onclick="stopScan()">✕</button>
        </div>
        <div id="reader"></div>
        <div class="scan-overlay">
            <div class="scan-frame">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <div class="scan-line"></div>
            </div>
            <p class="scan-tip">正在识别...</p>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        const scannerContainer = document.getElementById('scanner-container');

        async function startScan() {
            try {
                scannerContainer.classList.add('active');
                
                html5QrCode = new Html5Qrcode("reader");
                
                // 极速启动：直接用 facingMode，不遍历摄像头
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { 
                        fps: 8,                              // 平衡速度和精度
                        qrbox: { width: 320, height: 320 },  // 大扫描框，容纳更多像素
                        aspectRatio: 1.0,
                        videoConstraints: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        disableFlip: false
                    },
                    (decodedText, decodedResult) => {
                        console.log('✅ 扫描结果:', decodedText);
                        stopScan();
                        alert('扫描结果：\n\n' + decodedText);
                    },
                    (errorMessage) => {
                        // 解析中，静默处理
                    }
                );
                
            } catch (err) {
                console.error('启动失败:', err);
                
                // 如果 facingMode 失败，尝试用 deviceId 兜底
                if (err.name === 'OverconstrainedError' || err.name === 'NotAllowedError') {
                    tryBackCameraFallback();
                } else {
                    alert('启动失败: ' + err.message);
                    stopScan();
                }
            }
        }

        // 兜底：用 deviceId 找后置摄像头
        async function tryBackCameraFallback() {
            try {
                const devices = await Html5Qrcode.getCameras();
                const backCamera = devices.find(d => /back|rear|environment/i.test(d.label));
                
                if (backCamera && html5QrCode) {
                    await html5QrCode.start(
                        backCamera.id,
                        { 
                            fps: 8,
                            qrbox: { width: 320, height: 320 },
                            aspectRatio: 1.0,
                            disableFlip: false
                        },
                        (decodedText) => {
                            stopScan();
                            alert('扫描结果：\n\n' + decodedText);
                        },
                        () => {}
                    );
                } else {
                    throw new Error('未找到后置摄像头');
                }
            } catch (fallbackErr) {
                alert('无法启动后置摄像头: ' + fallbackErr.message);
                stopScan();
            }
        }

        async function stopScan() {
            scannerContainer.classList.remove('active');
            
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {
                    // 忽略清理错误
                }
                html5QrCode = null;
            }
        }

        window.addEventListener('beforeunload', stopScan);
    </script>
</body>
</html>
