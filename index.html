<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二维码扫描</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 360px;
            width: 100%;
        }
        
        .icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #07c160, #05a050);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(7,193,96,0.3);
        }
        
        .icon svg { width: 40px; height: 40px; color: white; }
        
        h1 { color: #333; font-size: 22px; margin-bottom: 12px; }
        .desc { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
        
        .scan-btn {
            background: linear-gradient(135deg, #07c160, #05a050);
            color: white; border: none;
            padding: 16px 48px;
            border-radius: 12px;
            font-size: 17px; font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(7,193,96,0.3);
            transition: all 0.3s;
            width: 100%;
        }
        .scan-btn:active { transform: scale(0.96); }
        
        /* 扫描界面 */
        #scanner {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }
        #scanner.active { display: block; }
        
        #video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        
        #debug-canvas {
            position: absolute;
            top: 10px; right: 10px;
            width: 120px; height: 120px;
            border: 2px solid #0f0;
            z-index: 100;
            opacity: 0; /* 设为 1 可调试 */
        }
        
        .header {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            color: white;
            z-index: 10;
        }
        .header span { font-size: 15px; font-weight: 500; }
        
        .close-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        
        /* 扫描框 */
        .frame-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            z-index: 5;
        }
        
        .corner {
            position: absolute;
            width: 30px; height: 30px;
            border-color: #00ff88;
            border-style: solid;
        }
        .tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; }
        .bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
        .br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }
        
        .scan-line {
            position: absolute;
            left: 10px; right: 10px;
            height: 2px;
            background: #00ff88;
            top: 0;
            animation: scan 2s ease-in-out infinite;
            box-shadow: 0 0 8px #00ff88;
        }
        
        @keyframes scan {
            0%, 100% { top: 10px; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            50% { top: calc(100% - 10px); }
        }
        
        .mask {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .mask::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }
        .mask::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 280px; height: 280px;
            background: transparent;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
            border-radius: 16px;
        }
        
        .tip {
            position: absolute;
            bottom: 100px;
            left: 0; right: 0;
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
            </svg>
        </div>
        <h1>二维码扫描V8</h1>
        <p class="desc">支持普通与高密二维码<br>自动调用后置摄像头</p>
        <button class="scan-btn" onclick="startScan()">开始扫描</button>
    </div>

    <div id="scanner">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="debug-canvas"></canvas>
        
        <div class="mask"></div>
        
        <div class="header">
            <span>将二维码对准框内</span>
            <button class="close-btn" onclick="stopScan()">✕</button>
        </div>
        
        <div class="frame-box">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="scan-line"></div>
        </div>
        
        <div class="tip">正在识别...</div>
    </div>

    <script>
        let stream = null;
        let scanInterval = null;
        const video = document.getElementById('video');
        const debugCanvas = document.getElementById('debug-canvas');
        const debugCtx = debugCanvas.getContext('2d');
        const scanner = document.getElementById('scanner');

        async function startScan() {
            try {
                scanner.classList.add('active');
                
                // 直接请求后置摄像头，不遍历
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await new Promise(r => video.onloadedmetadata = r);
                video.play();
                
                // 开始扫描
                scanInterval = setInterval(scanFrame, 200);
                
            } catch (err) {
                console.error(err);
                alert('启动失败: ' + err.message);
                stopScan();
            }
        }

        function scanFrame() {
            if (!stream || video.readyState < 3) return;

            const w = video.videoWidth;
            const h = video.videoHeight;
            if (!w || !h) return;

            // 创建临时 canvas，取视频中心区域（扫描框对应部分）
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            // 扫描框在屏幕上占 280px，视频是 object-fit: cover
            // 计算视频实际显示在屏幕上的缩放比例
            const videoRatio = w / h;
            const screenRatio = window.innerWidth / window.innerHeight;
            
            let renderW, renderH, startX, startY;
            
            if (videoRatio > screenRatio) {
                // 视频更宽，左右被裁切，高度铺满
                renderH = window.innerHeight;
                renderW = renderH * videoRatio;
                startX = (window.innerWidth - renderW) / 2;
                startY = 0;
            } else {
                // 视频更高，上下被裁切，宽度铺满
                renderW = window.innerWidth;
                renderH = renderW / videoRatio;
                startX = 0;
                startY = (window.innerHeight - renderH) / 2;
            }
            
            // 扫描框在屏幕上的位置（居中 280x280）
            const frameScreenX = (window.innerWidth - 280) / 2;
            const frameScreenY = (window.innerHeight - 280) / 2;
            
            // 转换为视频坐标系中的位置
            const scaleX = w / renderW;
            const scaleY = h / renderH;
            
            const sx = (frameScreenX - startX) * scaleX;
            const sy = (frameScreenY - startY) * scaleY;
            const sWidth = 280 * scaleX;
            const sHeight = 280 * scaleY;
            
            // 安全边界
            const srcX = Math.max(0, Math.floor(sx));
            const srcY = Math.max(0, Math.floor(sy));
            const srcW = Math.min(Math.floor(sWidth), w - srcX);
            const srcH = Math.min(Math.floor(sHeight), h - srcY);
            
            if (srcW < 50 || srcH < 50) return;
            
            // 设置 canvas 为截取区域的大小，放大到 800px 解析
            const targetSize = 800;
            canvas.width = targetSize;
            canvas.height = targetSize;
            
            // 绘制截取区域并放大
            ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, targetSize, targetSize);
            
            // 调试：显示实际分析的区域（把 opacity:0 改成 1 可见）
            debugCanvas.width = targetSize;
            debugCanvas.height = targetSize;
            debugCtx.drawImage(canvas, 0, 0);
            
            // 获取图像数据
            const imageData = ctx.getImageData(0, 0, targetSize, targetSize);
            
            // 尝试多种预处理策略
            const strategies = [
                // 策略1：原图直接试
                () => imageData,
                // 策略2：轻度灰度二值化
                () => binarize(imageData, 0.5),
                // 策略3：中度二值化
                () => binarize(imageData, 0.6),
                // 策略4：重度二值化（适合高密）
                () => binarize(imageData, 0.7),
            ];
            
            for (const strategy of strategies) {
                const data = strategy();
                const code = jsQR(data.data, data.width, data.height, {
                    inversionAttempts: 'attemptBoth'
                });
                
                if (code) {
                    console.log('✅ 识别成功:', code.data);
                    stopScan();
                    alert('扫描结果：\n\n' + code.data);
                    return;
                }
            }
        }

        function binarize(imageData, ratio) {
            const { data, width, height } = imageData;
            const len = width * height;
            let sum = 0;
            const gray = new Uint8Array(len);
            
            // 转灰度并计算均值
            for (let i = 0; i < len; i++) {
                const idx = i * 4;
                const v = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                gray[i] = v;
                sum += v;
            }
            
            const threshold = (sum / len) * ratio;
            const out = new Uint8ClampedArray(len * 4);
            
            for (let i = 0; i < len; i++) {
                const val = gray[i] < threshold ? 0 : 255;
                out[i * 4] = val;
                out[i * 4 + 1] = val;
                out[i * 4 + 2] = val;
                out[i * 4 + 3] = 255;
            }
            
            return new ImageData(out, width, height);
        }

        function stopScan() {
            scanner.classList.remove('active');
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
        }

        window.addEventListener('beforeunload', stopScan);
    </script>
</body>
</html>
